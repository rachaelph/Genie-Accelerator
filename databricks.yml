bundle:
  name: genie-accelerator

# Files to upload into the workspace. Anything outside `sync.include`
# (metadata/, prompts/, skills/, validate_metadata.py, README.md) stays local.
sync:
  include:
    - notebooks/**

workspace:
  # Bundle artifacts land here in the workspace file tree.
  # Notebooks become available at:
  #   /Workspace/Users/<you>/.bundle/genie-accelerator/<target>/files/notebooks/...
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# -------------------------------------------------------------------
# Resources: DLT pipelines + an orchestration job
#
# IMPORTANT: pipelines reference notebooks generated by /genie-04..06.
# Run those prompts BEFORE `databricks bundle deploy`, or `bundle validate`
# will warn about missing notebook paths.
# -------------------------------------------------------------------
resources:
  pipelines:
    bronze_pipeline:
      name: genie-${bundle.target}-bronze
      catalog: kpi_testing
      target: bronze
      serverless: true
      photon: true
      development: true
      continuous: false
      libraries:
        - notebook:
            path: ./notebooks/bronze/04_bronze_dlt.py

    silver_pipeline:
      name: genie-${bundle.target}-silver
      catalog: kpi_testing
      target: silver
      serverless: true
      photon: true
      development: true
      continuous: false
      libraries:
        - notebook:
            path: ./notebooks/silver/05_silver_dlt.py

    gold_pipeline:
      name: genie-${bundle.target}-gold
      catalog: kpi_testing
      target: gold
      serverless: true
      photon: true
      development: true
      continuous: false
      libraries:
        - notebook:
            path: ./notebooks/gold/06_gold_dlt.py

  jobs:
    genie_demo_e2e:
      name: genie-${bundle.target}-e2e
      tasks:
        - task_key: deploy_catalog
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ./notebooks/00_deploy_catalog.sql
              source: WORKSPACE

        - task_key: upload_csvs
          depends_on: [{ task_key: deploy_catalog }]
          notebook_task:
            notebook_path: ./notebooks/landing/00_upload_csvs_to_volume.py
            base_parameters:
              source_dir: ${var.csv_source_dir}

        - task_key: deploy_metadata_tables
          depends_on: [{ task_key: deploy_catalog }]
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ./notebooks/02_metadata_tables.sql
              source: WORKSPACE

        - task_key: land_housing
          depends_on: [{ task_key: upload_csvs }]
          notebook_task:
            notebook_path: ./notebooks/landing/03_landing_housing_price.py

        - task_key: land_titanic
          depends_on: [{ task_key: upload_csvs }]
          notebook_task:
            notebook_path: ./notebooks/landing/03_landing_titanic.py

        - task_key: land_nyc
          depends_on: [{ task_key: upload_csvs }]
          notebook_task:
            notebook_path: ./notebooks/landing/03_landing_nyc_taxi.py

        - task_key: land_london
          depends_on: [{ task_key: upload_csvs }]
          notebook_task:
            notebook_path: ./notebooks/landing/03_landing_london_taxi.py

        - task_key: bronze_dlt
          depends_on:
            - { task_key: land_housing }
            - { task_key: land_titanic }
            - { task_key: land_nyc }
            - { task_key: land_london }
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}

        - task_key: silver_dlt
          depends_on: [{ task_key: bronze_dlt }]
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}

        - task_key: gold_dlt
          depends_on: [{ task_key: silver_dlt }]
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}

        - task_key: genie_views
          depends_on: [{ task_key: gold_dlt }]
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ./notebooks/views/07_genie_views.sql
              source: WORKSPACE

variables:
  sql_warehouse_id:
    description: "SQL warehouse used for SQL notebook tasks (catalog / metadata / views)."
    default: ""
  csv_source_dir:
    description: "Workspace folder holding the four source CSVs (e.g. /Workspace/Shared/sample_data)."
    default: "/Workspace/Shared/sample_data"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405606904496964.4.azuredatabricks.net
